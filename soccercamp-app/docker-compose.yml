services:
  soccercamp-app:
    image: ghcr.io/andycqos74/soccercamp-app:latest
    pull_policy: always
    container_name: soccercamp-app
    restart: unless-stopped
    environment:
      PORT: 3000
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT:-3306}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME:-qosfctickets}
      TICKETCO_API_TOKEN: ${TICKETCO_API_TOKEN}
      SEASON_PASS_ID: ${SEASON_PASS_ID:-1127619}
      TICKET_TYPE_FILTER: ${TICKET_TYPE_FILTER:-Soccer Camps 2026}
    ports:
      - "3010:3000"
    networks:
      - shared_net

networks:
  shared_net:
    # The Docker network the mysql-tickets container is already on, so this
    # app can reach it by container name (DB_HOST=mysql-tickets in .env).
    external: true
    name: root_default
